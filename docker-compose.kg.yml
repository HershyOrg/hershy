version: "3.9"

services:
  kg-postgres:
    image: pgvector/pgvector:pg16
    container_name: hershy-kg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hershy_kg
    ports:
      - "5433:5432"
    volumes:
      - kg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hershy_kg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kg_pgdata:
    driver: local
